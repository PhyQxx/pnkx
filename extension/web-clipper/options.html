<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>pnkx 网址收藏 - 设置</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #F2F7FE;
            color: #303133;
            max-width: 520px;
            margin: 40px auto;
            padding: 0 16px;
        }
        h1 { font-size: 18px; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(64, 111, 176, 0.08);
        }
        .form-item { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #606266; margin-bottom: 6px; }
        input {
            width: 100%;
            box-sizing: border-box;
            height: 36px;
            border: 1px solid #DCDFE6;
            border-radius: 8px;
            padding: 0 10px;
            font-size: 13px;
        }
        input:focus { outline: none; border-color: #4F86F7; }
        .btn-row { display: flex; gap: 10px; margin-top: 18px; }
        button {
            height: 36px;
            padding: 0 22px;
            border: none;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .primary { background: #4F86F7; color: #fff; }
        .plain { background: #ECF2FD; color: #4F86F7; }
        .result { margin-top: 12px; font-size: 13px; display: none; padding: 10px 12px; border-radius: 8px; }
        .result.ok { display: block; background: #F0F9EB; color: #67C23A; }
        .result.err { display: block; background: #FEF0F0; color: #F56C6C; }
        .tip { font-size: 12px; color: #909399; line-height: 1.8; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>pnkx 网址收藏 设置</h1>
    <div class="card">
        <div class="form-item">
            <label>服务器地址（后端 API 根地址）</label>
            <input id="apiUrl" placeholder="例如 https://api.pnkx.top 或 http://192.168.1.10:8080">
        </div>
        <div class="form-item">
            <label>用户名</label>
            <input id="username" placeholder="pnkx 登录账号">
        </div>
        <div class="form-item">
            <label>密码</label>
            <input id="password" type="password" placeholder="pnkx 登录密码">
        </div>
        <div class="btn-row">
            <button class="primary" id="saveBtn">保存</button>
            <button class="plain" id="testBtn">测试连接</button>
        </div>
        <div class="result" id="result"></div>
        <div class="tip">
            密码仅保存在本机浏览器（chrome.storage.local），仅用于向后端登录换取令牌。
            服务器地址填后端 API 根地址（管理端页面请求的基础地址，含端口）。
        </div>
    </div>
    <script type="module" src="options.js"></script>
</body>
</html>
