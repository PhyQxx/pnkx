# 项目相关配置
pnkx:
  # 名称
  name: Pnkx
  # 版本
  version: 3.3.0
  # 版权年份
  copyrightYear: 2021
  # 实例演示开关
  demoEnabled: true
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 上传路径（本地临时中转目录，用于分片暂存和合并）
  profile: /tmp/pnkx

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: ${SERVER_PORT:8068}
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    threads:
      max: 800
    # Tomcat启动初始化的线程数，默认值25
      min-spare: 30

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: ${SWAGGER_ENABLED:true}

# 日志配置
logging:
  level:
    com.pnkx: ${LOG_LEVEL:info}
    org.springframework: warn

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 30MB
      # 设置总上传的文件大小
      max-request-size: 100MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  # 邮箱配置
  mail:
    host: smtp.qq.com
    username: ${MAIL_USERNAME:}
    #邮箱授权码
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          ssl:
            trust: smtp.qq.com
          auth: true
          starttls:
            enable: true
          required: true
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据源
      master:
        url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/pnkx?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8}
        userName: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:123456}
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        userName:
        password:
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      # 借出连接前先校验，避免拿到被 MySQL/网络关掉的死连接（修复 Quartz CommunicationsException）
      testOnBorrow: true
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow: 127.0.0.1
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-userName: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:pnkx2024}
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  data:
    redis:
      # 地址
      host: ${REDIS_HOST:127.0.0.1}
      # 端口，默认为6379
      port: ${REDIS_PORT:6379}
      # 数据库索引
      database: 0
      # 密码
      password: ${REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      # 连接超时时间
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  # Flyway 数据库版本管理
  # 启动时自动执行 classpath:db/migration 下的迁移脚本
  # 使用独立连接（不依赖 Druid 动态数据源），复用同一套环境变量
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/pnkx?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8}
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    locations: classpath:db/migration
    # 对已有库标记基线，不报错（本项目基础表早于 Flyway 引入）
    baseline-on-migrate: true
    baseline-version: 0
    # 兼容已运行库，不强制校验历史脚本
    validate-on-migrate: false
    encoding: UTF-8
    # 生产安全：禁用 clean，防止误清库
    clean-disabled: true

ftp:
  # ftp地址
  host: ${FTP_HOST:127.0.0.1}
  # ftp端口
  port: ${FTP_PORT:21}
  # ftp用户名
  username: ${FTP_USERNAME:admin}
  # ftp密码
  password: ${FTP_PASSWORD:}
  # ftp上传路径
  path: /ftp/

# 微信小程序配置（用于微信登录，需填入真实 appsecret）
wx:
  # 小程序appid
  appid: ${WX_APPID:wx1a797ab499d31dac}
  # 小程序secret（微信公众平台获取，请勿泄露）
  secret: ${WX_SECRET:ba5d00689e69daea56ec6aa4ad7844c5}
  subscribe:
    templates:
      commemoration: ${WX_TEMPLATE_COMMEMORATION:}
      menstruation: ${WX_TEMPLATE_MENSTRUATION:}

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥 (HS512需至少64个字符，生产环境必须通过环境变量配置)
  secret: ${TOKEN_SECRET:}
  # 令牌有效期（默认24小时，单位分钟）
  expireTime: ${TOKEN_EXPIRE:1440}

# MyBatis-Plus 配置
mybatis-plus:
  # 搜索指定包别名
  type-aliases-package: com.pnkx.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件（保留原有 mybatis-config.xml 的 setting，含 mapUnderscoreToCamelCase）
  # 注意：config-location 与 configuration 不可同时使用，故驼峰等 setting 统一在 mybatis-config.xml 中维护
  config-location: classpath:mybatis/mybatis-config.xml
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/px/*,/blog/*,/chat/*
