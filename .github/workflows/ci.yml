name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端构建（Spring Boot / JDK 21）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 编译打包
        working-directory: pnkx-admin
        run: mvn -B -DskipTests package

      - name: 全量单元测试（无外部环境依赖；含 MybatisMapperBindingTest 绑定门禁，其余集成测试仅在本地跑）
        working-directory: pnkx-admin
        run: mvn -B test

  pnkx-ui:
    name: 后台前端构建（Vue 3 / Vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        working-directory: pnkx-ui
        run: npm install --no-audit --no-fund

      - name: Lint（错误级须为 0，警告级为存量迁移债不阻塞）
        working-directory: pnkx-ui
        run: npm run lint

      - name: 构建
        working-directory: pnkx-ui
        run: npm run build

      - name: 移动路由映射一致性
        working-directory: pnkx-ui
        run: npm run check:mobile-map

      - name: 设计系统守护
        working-directory: pnkx-ui
        run: npm run validate:ui

      - name: 单元/契约测试
        working-directory: pnkx-ui
        run: npm run test:unit

      - name: 安装 Playwright Chromium
        working-directory: pnkx-ui
        run: npx playwright install chromium --with-deps

      - name: E2E + 视觉回归（chromium，Mock Server 无需后端）
        working-directory: pnkx-ui
        env:
          BROWSER: none
        run: npm run test:e2e

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            pnkx-ui/node_modules/.cache/pw-report
            pnkx-ui/node_modules/.cache/pw-test-results
          retention-days: 7

      - name: 依赖安全审计（非阻塞，仅提醒）
        working-directory: pnkx-ui
        continue-on-error: true
        run: npm audit --audit-level=high

  pnkx-client:
    name: 博客前台构建（Nuxt 3）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装依赖
        working-directory: pnkx-client
        run: pnpm install --no-frozen-lockfile

      - name: 构建
        working-directory: pnkx-client
        run: pnpm build

      - name: 依赖安全审计（非阻塞，仅提醒）
        working-directory: pnkx-client
        continue-on-error: true
        run: pnpm audit --audit-level=high

  uniapp-deps:
    name: 移动端依赖校验（uniapp）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 依赖安装校验（构建产物由 HBuilderX 发布，不在 CI 范围）
        working-directory: pnkx-uniapp
        run: pnpm install --frozen-lockfile

      - name: 离线同步契约测试
        working-directory: pnkx-uniapp
        run: pnpm test:contracts
